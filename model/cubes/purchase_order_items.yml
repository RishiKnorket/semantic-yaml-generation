---
cubes:
- name: purchase_order_items
  sql_table: neonjulymaulik.public.purchase_order_items
  dimensions:
  - name: po_id
    sql: po_id
    type: string
    primary_key: true
  - name: po_item_id
    sql: po_item_id
    type: string
    primary_key: true
  - name: product_id
    sql: product_id
    type: string
    primary_key: true
  - name: qty_ordered
    sql: qty_ordered
    type: string
    primary_key: false
  - name: qty_received
    sql: qty_received
    type: string
    primary_key: false
  - name: unit_cost
    sql: unit_cost
    type: string
    primary_key: false
  measures:
  - name: avg_qty_ordered
    type: avg
    sql: qty_ordered
  - name: avg_qty_received
    type: avg
    sql: qty_received
  - name: avg_unit_cost
    type: avg
    sql: unit_cost
  - name: max_qty_ordered
    type: max
    sql: qty_ordered
  - name: max_qty_received
    type: max
    sql: qty_received
  - name: max_unit_cost
    type: max
    sql: unit_cost
  - name: min_qty_ordered
    type: min
    sql: qty_ordered
  - name: min_qty_received
    type: min
    sql: qty_received
  - name: min_unit_cost
    type: min
    sql: unit_cost
  - name: row_count
    type: count
    sql:
  - name: sum_qty_ordered
    type: sum
    sql: qty_ordered
  - name: sum_qty_received
    type: sum
    sql: qty_received
  - name: sum_unit_cost
    type: sum
    sql: unit_cost
